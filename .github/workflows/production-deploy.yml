name: Deploy Frontend to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://hacksync.prakharverse.me

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Node.js and Yarn
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build production application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::104203586203:role/HackSync-Frontend-Production-Deploy
          aws-region: ap-south-1
          allowed-account-ids: 104203586203

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://hacksync-bucket/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ESTW4FI6B62X1 \
            --paths "/*"